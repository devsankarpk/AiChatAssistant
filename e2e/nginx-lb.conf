# A load balancer in front of every API replica, so a browser (or a SignalR client) can be sent to any of them.
# nginx looks the names up when it starts: restart this container after replicas are recreated (e2e/lib.mjs refreshLb does).
upstream api_all {
  server api:8080;
  server api2:8080;
  server api3:8080;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
server {
  listen 8080;
  location /api/ {
    proxy_pass http://api_all;
    proxy_next_upstream error timeout;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
  }
  location /hubs/ {
    proxy_pass http://api_all;
    proxy_next_upstream error timeout;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
  location / {
    proxy_pass http://web:8080;
    proxy_set_header Host $host;
  }
}
