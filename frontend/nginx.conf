server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Same-origin API: the Angular build calls '/api/...' (environment.ts), so the browser never
  # needs CORS. 'api' is the .NET service's name in both docker-compose and Kubernetes.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Timeouts are nested (CLAUDE.md): Python ~50s < .NET 60s < this. A smaller value here would
    # cut a slow-but-valid LLM reply off before .NET answers.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  # Hashed build assets never change under the same name.
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Path-mode routing: deep links (/reset-password?token=...) must fall back to the SPA.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
