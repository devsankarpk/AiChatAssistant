# Lets a WebSocket upgrade through while leaving ordinary requests (SignalR's long-polling fallback
# and negotiate call) as plain keep-alive HTTP.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# HSTS value: only for requests that came in over HTTPS at a proxy in front of this one (see nginx-security-headers.inc).
map $http_x_forwarded_proto $hsts_header {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Do not announce the nginx version in the Server header or on error pages.
  server_tokens off;
  include /etc/nginx/security-headers.inc;

  # Same-origin API: the Angular build calls '/api/...' (environment.ts), so the browser never
  # needs CORS. 'api' is the .NET service's name in both docker-compose and Kubernetes.
  location /api/ {
    proxy_pass http://api:8080;
    # The API sets these itself too; hide its copies so each header appears once (the policy below is the one that counts).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/security-headers.inc;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Timeouts are nested (CLAUDE.md): Python ~50s < .NET 60s < this. A smaller value here would
    # cut a slow-but-valid LLM reply off before .NET answers.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
  }

  # Realtime direct chat (SignalR). The browser connects to the same origin at /hubs/direct, so no
  # CORS is needed here either. The WebSocket must stay open for hours, so the read timeout is long
  # (the 75s used for /api would cut every idle connection); SignalR's own keep-alive pings keep it
  # from being treated as idle by anything in between.
  location /hubs/ {
    proxy_pass http://api:8080;
    # The API sets these itself too; hide its copies so each header appears once (the policy below is the one that counts).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/security-headers.inc;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Hashed build assets never change under the same name.
  location ~* \.(?:js|css|woff2?|png|jpg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security-headers.inc;
    try_files $uri =404;
  }

  # Path-mode routing: deep links (/reset-password?token=...) must fall back to the SPA.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}
