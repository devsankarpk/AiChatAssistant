<app-auth-shell>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Log in</h1>

    <label class="field">
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field-error">Enter a valid email address.</p>
    }

    <div class="field">
      <div class="field-row">
        <label for="login-password">Password</label>
        <a class="switch-link" routerLink="/forgot-password">Forgot password?</a>
      </div>
      <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
    </div>
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="field-error">Enter your password.</p>
    }

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>

    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </form>
</app-auth-shell>
