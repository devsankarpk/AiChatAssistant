<app-auth-shell>
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Create an account</h1>

    <label class="field">
      Name
      <input type="text" formControlName="name" autocomplete="name" />
    </label>
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <p class="field-error">Enter your name.</p>
    }

    <label class="field">
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field-error">Enter a valid email address.</p>
    }

    <label class="field">
      Password
      <input type="password" formControlName="password" autocomplete="new-password" aria-describedby="register-password-hint" />
      <span
        id="register-password-hint"
        class="field-hint"
        [class.is-error]="form.controls.password.invalid && form.controls.password.touched"
      >Use at least 8 characters.</span>
    </label>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>

    <p class="switch-link">Already have an account? <a routerLink="/login">Log in</a></p>
  </form>
</app-auth-shell>
