name: CI

# Runs on every PR into main and on pushes to any other branch. cd.yml also calls it (workflow_call)
# so nothing is published unless these jobs pass.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

# A newer push/PR update supersedes an older run on the same branch - except on main, where every
# commit's run should finish.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore backend-dotnet/AiChatAssistant.sln
      - run: dotnet build backend-dotnet/AiChatAssistant.sln -c Release --no-restore
      - run: dotnet test backend-dotnet/AiChatAssistant.sln -c Release --no-build

  ai-service:
    name: AI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service-python/requirements.txt
      - run: pip install -r requirements.txt
      # Fully mocked: conftest.py sets fake keys, so no secrets or network are needed.
      - run: pytest

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --karma-config=karma.conf.js --browsers=ChromeHeadlessCI
      - run: npm run build

  containers:
    name: Image builds (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: backend-dotnet/Dockerfile, target: api }
          - { name: migrate, context: ., file: backend-dotnet/Dockerfile, target: migrate }
          - { name: ai-service, context: ai-service-python, file: ai-service-python/Dockerfile }
          - { name: web, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push): catches a broken Dockerfile on the PR instead of after the merge.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  manifests:
    name: Compose and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid
        run: |
          ./scripts/gen-docker-env.sh
          DEEPINFRA_API_KEY=ci-placeholder docker compose --env-file docker.env config -q
      - name: Kustomize overlays render and pass schema validation
        run: |
          for overlay in local ghcr; do
            echo "== $overlay"
            kubectl kustomize "k8s/overlays/$overlay" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
          done
