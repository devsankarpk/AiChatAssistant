name: CD

# On every merge to main (and on v* tags): re-run CI, then publish the four images to GitHub
# Container Registry. Deploying them is a separate, manual step - see README "CI/CD".
#   tags:  sha-<short>  (always)   latest  (main only)   1.2.3 / 1.2  (v1.2.3 tags)
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: backend-dotnet/Dockerfile, target: api }
          - { name: migrate, context: ., file: backend-dotnet/Dockerfile, target: migrate }
          - { name: ai-service, context: ai-service-python, file: ai-service-python/Dockerfile }
          - { name: web, context: frontend, file: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this, which GHCR requires (repo name has capitals).
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
