# Whole stack in containers:
#   ./scripts/gen-docker-env.sh                       # once; then set DEEPINFRA_API_KEY in docker.env
#   docker compose --env-file docker.env up --build -d
#   open http://localhost:8080
name: aichat

x-db-connection: &db-connection
  ConnectionStrings__Default: "Server=mysql;Port=3306;Database=AiChatAssistant;User=aichat;Password=${MYSQL_PASSWORD:?set in docker.env}"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in docker.env}
      MYSQL_DATABASE: AiChatAssistant
      MYSQL_USER: aichat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in docker.env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Over TCP on purpose: during first-run init MySQL listens on a socket only, so this
      # stays unhealthy until the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Message brokers (README: "Message brokers"). Neither publishes a port: only the api container
  # reaches them, over the compose network, with a password. RabbitMQ carries raw password-reset
  # links, so it must never be reachable from outside.
  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aichat
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in docker.env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # SignalR backplane and shared presence (Phase 16): lets the api run as several replicas,
  # `docker compose --env-file docker.env up -d --scale api=2`.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in docker.env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    image: aichat-migrate:local
    build:
      context: .
      dockerfile: backend-dotnet/Dockerfile
      target: migrate
    environment:
      <<: *db-connection
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  ai-service:
    image: aichat-ai-service:local
    build:
      context: ./ai-service-python
    environment:
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:?set DEEPINFRA_API_KEY in docker.env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set in docker.env}
    restart: unless-stopped

  api:
    image: aichat-api:local
    build:
      context: .
      dockerfile: backend-dotnet/Dockerfile
      target: api
    environment:
      <<: *db-connection
      Jwt__Key: ${JWT_KEY:?set in docker.env}
      PythonService__BaseUrl: http://ai-service:8000
      PythonService__InternalApiKey: ${INTERNAL_API_KEY:?set in docker.env}
      Frontend__BaseUrl: ${PUBLIC_URL:-http://localhost:8080}
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost:8080}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: aichat
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?set in docker.env}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      # The aspnet image has no curl/wget; bash's /dev/tcp is enough to hit /health.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && head -n1 <&3 | grep -q 200'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    image: aichat-web:local
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  rabbitmq-data:
  redis-data:
