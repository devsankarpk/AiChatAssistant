# Images built on this machine (scripts/k8s-deploy-local.sh). Docker Desktop's cluster shares
# the local Docker image store, so no registry is involved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - { name: aichat-api, newTag: local }
  - { name: aichat-migrate, newTag: local }
  - { name: aichat-ai-service, newTag: local }
  - { name: aichat-web, newTag: local }
