apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: MYSQL_ROOT_PASSWORD } }
            - name: MYSQL_DATABASE
              value: AiChatAssistant
            - name: MYSQL_USER
              value: aichat
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: MYSQL_PASSWORD } }
          readinessProbe:
            exec:
              # TCP on purpose: during first-run init MySQL listens on a socket only.
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
