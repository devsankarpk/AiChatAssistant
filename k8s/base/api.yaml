apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Keep at 1 while migrations run as an initContainer: two pods could migrate at the same time
  # (EF Core 8 takes no migration lock). To scale out, move `migrate` to a Job.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: migrate
          image: aichat-migrate
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: MYSQL_PASSWORD } }
            - name: ConnectionStrings__Default
              # $(MYSQL_PASSWORD) is expanded by Kubernetes from the env var defined just above.
              value: "Server=mysql;Port=3306;Database=AiChatAssistant;User=aichat;Password=$(MYSQL_PASSWORD)"
          # If MySQL isn't accepting connections yet this exits non-zero and Kubernetes retries
          # the init container with backoff, so no separate wait-for-mysql step is needed.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: api
          image: aichat-api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: MYSQL_PASSWORD } }
            - name: ConnectionStrings__Default
              value: "Server=mysql;Port=3306;Database=AiChatAssistant;User=aichat;Password=$(MYSQL_PASSWORD)"
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: JWT_KEY } }
            - name: PythonService__InternalApiKey
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: INTERNAL_API_KEY } }
            - name: PythonService__BaseUrl
              value: http://ai-service:8000
            - name: Frontend__BaseUrl
              valueFrom: { configMapKeyRef: { name: aichat-config, key: PUBLIC_URL } }
            - name: Cors__AllowedOrigins__0
              valueFrom: { configMapKeyRef: { name: aichat-config, key: PUBLIC_URL } }
            - name: Smtp__Username
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: SMTP_USERNAME, optional: true } }
            - name: Smtp__Password
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: SMTP_PASSWORD, optional: true } }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
