# Non-secret settings. Secrets live in the `aichat-secrets` Secret, which is NOT in this repo:
# scripts/k8s-deploy-local.sh creates it from docker.env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aichat-config
data:
  # Where users reach the app in a browser (password-reset links, CORS). Matches the `web`
  # Service port below.
  PUBLIC_URL: "http://localhost:8081"
