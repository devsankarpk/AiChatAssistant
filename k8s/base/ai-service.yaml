apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ai-service
          image: aichat-ai-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DEEPINFRA_API_KEY
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: DEEPINFRA_API_KEY } }
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: aichat-secrets, key: INTERNAL_API_KEY } }
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
