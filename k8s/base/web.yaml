apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  # LoadBalancer: Docker Desktop publishes it on localhost:8081 (docker-compose uses 8080, so both
  # can run side by side). On a real cluster this provisions a cloud load balancer.
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 8081
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged's `nginx` user; Kubernetes can't verify a named user is non-root.
        runAsUser: 101
      containers:
        - name: web
          image: aichat-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
